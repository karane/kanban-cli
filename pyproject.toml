[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kanban-cli"
version = "0.1.0"
description = "A CLI tool for managing Kanban boards"
requires-python = ">=3.8"

[project.scripts]
kbcli = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]
